services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: speaking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d speaking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  a_say_backend:
    image: a_say_backend:latest
    build:
      context: .
      dockerfile: Dockerfile.simple
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2580:2580"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/speaking_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=your_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - JWT_SECRET=YourSuperSecretKeyHereMustBeVeryLongAndComplex123!AtLeast32Characters

volumes:
  postgres_data: