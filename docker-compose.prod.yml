# 生产环境 Docker Compose（含 Nginx SSL 反向代理）
# 用法: docker-compose -f docker-compose.prod.yml up -d
#
# 环境变量（通过 CI/CD secrets 或服务器 .env 文件注入）:
#   DOCKER_REGISTRY, IMAGE_NAME, DEEPSEEK_API_KEY, JWT_SECRET
#   BAIDU_API_KEY, BAIDU_SECRET_KEY, DB_URL, DB_USERNAME, DB_PASSWORD

services:
  # ── PostgreSQL 数据库 ────────────────────────────────
  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_DB: speaking_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d speaking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Spring Boot 应用（仅内网，不对外暴露端口）────────
  a_say_backend:
    image: ${DOCKER_REGISTRY}/${IMAGE_NAME}:latest
    expose:
      - "2580"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL:-jdbc:postgresql://postgres-db:5432/speaking_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - JWT_SECRET=${JWT_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BAIDU_API_KEY=${BAIDU_API_KEY}
      - BAIDU_SECRET_KEY=${BAIDU_SECRET_KEY}
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
    volumes:
      - uploads_data:/app/uploads
    networks:
      - backend
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx 反向代理（SSL 终结）───────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs/server.crt:/etc/nginx/ssl/server.crt:ro
      - /etc/ssl/private/server.key:/etc/nginx/ssl/server.key:ro
      # Let's Encrypt 域名证书（如有域名可覆盖上面两行）
      # - /etc/letsencrypt:/etc/nginx/ssl/letsencrypt:ro
    networks:
      - backend
    depends_on:
      - a_say_backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
