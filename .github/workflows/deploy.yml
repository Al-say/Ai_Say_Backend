name: Production Build and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      # 关键修改 1：构建后立即删除 .original 文件，确保目录下只有一个 jar
      run: |
        mvn clean package -DskipTests
        rm -f target/*.jar.original

    - name: Transfer JAR to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        source: "target/*.jar"
        target: "/home/${{ secrets.USERNAME }}/github_deploy"
        strip_components: 1

    - name: Restart Application
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        # 关键修改 2：删除了无效的 script_stop 参数
        # 关键修改 3：在 script 中加入 set -e，任何命令报错立即停止
        script: |
          set -e
          
          APP_NAME="app.jar"
          DEPLOY_DIR="/home/${{ secrets.USERNAME }}/github_deploy"
          
          cd $DEPLOY_DIR
          
          # === 修复点开始 ===
          # 1. 先查找旧的 Java 进程（只匹配 java -jar app.jar，避免误杀自己）
          # 使用 grep -v grep 排除掉 grep 命令本身
          PID=$(ps -ef | grep "java -jar $APP_NAME" | grep -v grep | awk '{print $2}')
          
          if [ -n "$PID" ]; then
            echo "Stopping existing application (PID: $PID)..."
            kill -9 $PID
          else
            echo "No running application found."
          fi
          # === 修复点结束 ===
          
          # 2. 清理旧文件并重命名新文件
          rm -f $APP_NAME
          mv *.jar $APP_NAME
          
          echo "Starting new application..."
          nohup java -jar $APP_NAME > app.log 2>&1 &
          
          # 3. 健康检查
          sleep 5
          # 同样使用精确匹配来检查是否启动成功
          if ps -ef | grep "java -jar $APP_NAME" | grep -v grep > /dev/null; then
            echo "✅ Deployment Successful! Application is running."
          else
            echo "❌ Deployment Failed! Application process died."
            tail -n 20 app.log
            exit 1
          fi