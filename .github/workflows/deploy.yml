name: Production Build and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      # 关键修改 1：构建后立即删除 .original 文件，确保目录下只有一个 jar
      run: |
        mvn clean package -DskipTests
        rm -f target/*.jar.original

    - name: Transfer JAR to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        source: "target/*.jar"
        target: "/home/${{ secrets.USERNAME }}/github_deploy"
        strip_components: 1

    - name: Restart Application
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        # 关键修改 2：删除了无效的 script_stop 参数
        # 关键修改 3：在 script 中加入 set -e，任何命令报错立即停止
        script: |
          set -e  # 开启严格模式，任何命令失败则脚本终止
          
          APP_NAME="app.jar"
          DEPLOY_DIR="/home/${{ secrets.USERNAME }}/github_deploy"
          
          cd $DEPLOY_DIR
          
          # 强制清理旧的 app.jar，防止 mv 冲突
          rm -f $APP_NAME
          
          # 现在目录下只有一个 jar，mv 绝对安全
          mv *.jar $APP_NAME
          
          # === 进程管理 ===
          
          # 查找并杀死旧进程
          # 使用 || true 确保即使没找到进程，脚本也不会因此报错退出
          PID=$(pgrep -f $APP_NAME) || true
          if [ -n "$PID" ]; then
            echo "Stopping existing application (PID: $PID)..."
            kill -9 $PID
          else
            echo "No running application found."
          fi
          
          echo "Starting new application..."
          # 启动新进程
          nohup java -jar $APP_NAME > app.log 2>&1 &
          
          # === 健康检查 ===
          sleep 5
          if pgrep -f $APP_NAME > /dev/null; then
            echo "✅ Deployment Successful! Application is running."
          else
            echo "❌ Deployment Failed! Application process died."
            tail -n 20 app.log
            exit 1
          fi