name: Docker Build and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    # 🌟 关键修改：从 ubuntu-latest 改为 self-hosted
    # 这意味着任务直接飞到你的火山云服务器上执行，不需要跨国传输！
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 直接在服务器本地构建并启动 (不需要 Push 到阿里云了！)
    - name: Build and Run
      run: |
        echo "1. Building Docker Image Locally..."
        # 直接利用服务器本地缓存构建，速度极快
        docker build -t ai-backend:latest .
        
        echo "2. Removing old container..."
        docker stop ai-backend || true
        docker rm -f ai-backend || true
        
        echo "3. Starting new container..."
        # 直接启动，环境变量全部保留
        docker run -d \
          --name ai-backend \
          --net=host \
          --restart always \
          -e SERVER_PORT='2580' \
          -e SPRING_DATASOURCE_URL='${{ secrets.DB_URL }}' \
          -e SPRING_DATASOURCE_USERNAME='${{ secrets.DB_USERNAME }}' \
          -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
          -e DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}' \
          -e DEEPSEEK_API_URL='https://api.deepseek.com' \
          -e DEEPSEEK_API_MODEL='deepseek-chat' \
          -e BAIDU_API_KEY='${{ secrets.BAIDU_API_KEY }}' \
          -e BAIDU_SECRET_KEY='${{ secrets.BAIDU_SECRET_KEY }}' \
          -e FFMPEG_PATH='/usr/bin/ffmpeg' \
          -e FFPROBE_PATH='/usr/bin/ffprobe' \
          -e AUDIO_TEMP_DIR='/tmp' \
          -e SCENE_PROMPTS_EXAM_PREP='You are an English IELTS examiner. Please correct my grammar mistakes.' \
          -e SCENE_PROMPTS_CAREER_GROWTH='You are a senior business partner. Help me practice interview questions.' \
          -e STORAGE_TYPE='local' \
          -e STORAGE_LOCAL_ROOT='/app/uploads' \
          -e STORAGE_S3_ENDPOINT='http://localhost' \
          -e STORAGE_S3_ACCESS_KEY='dummy' \
          -e STORAGE_S3_SECRET_KEY='dummy' \
          -e STORAGE_S3_BUCKET='dummy' \
          -e STORAGE_S3_REGION='us-east-1' \
          ai-backend:latest
          
        echo "4. Cleaning up..."
        docker image prune -f