name: Deploy via Aliyun ACR (Professional)

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 极速拉取代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 设置 JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 3. 编译 JAR 包
    - name: Build JAR
      run: mvn clean package -DskipTests

    # 4. 登录阿里云镜像仓库 (GitHub 端)
    - name: Login to Aliyun ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. 构建并推送 Docker 镜像
    - name: Build and Push Docker Image
      run: |
        # 修正点：使用 eclipse-temurin:21-jdk 替代已废弃的 openjdk:21-jdk-slim
        echo 'FROM eclipse-temurin:21-jdk' > Dockerfile
        echo 'COPY target/speaking-0.0.1-SNAPSHOT.jar app.jar' >> Dockerfile
        # 🔥 关键：在这里直接把 PostgreSQL 驱动和自动建表参数打进镜像里，防止 H2 复辟
        echo 'ENTRYPOINT ["java", "-Dspring.datasource.driver-class-name=org.postgresql.Driver", "-Dspring.jpa.hibernate.ddl-auto=update", "-jar", "/app.jar"]' >> Dockerfile

        # 标记镜像 (格式: registry/namespace/repo:latest)
        IMAGE_TAG="${{ secrets.DOCKER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest"

        echo "Building image: $IMAGE_TAG"
        docker build -t $IMAGE_TAG .

        echo "Pushing image to Aliyun..."
        docker push $IMAGE_TAG

    # 🔥 关键修正：使用 key 参数进行 SSH 登录
    - name: SSH Remote Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SERVER_PRIVATE_KEY }}  # 👈 确保这里用的是 key
        script: |
          # 定义镜像地址
          IMAGE_TAG="${{ secrets.DOCKER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest"

          echo "🚀 Starting Deployment..."

          # 1. 登录阿里云 (服务器端也需要登录才能拉取)
          docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }} ${{ secrets.DOCKER_REGISTRY }}

          # 2. 拉取最新镜像
          echo "📥 Pulling latest image..."
          docker pull $IMAGE_TAG

          # 3. 停止并删除旧容器
          docker rm -f ai-backend || true

          # 4. 启动新容器 (带上所有环境变量)
          echo "🔥 Starting container..."
          docker run -d \
            --name ai-backend \
            --restart always \
            -p 2580:2580 \
            --link postgres-db:db \
            -e SPRING_DATASOURCE_URL='${{ secrets.DB_URL }}' \
            -e SPRING_DATASOURCE_USERNAME='${{ secrets.DB_USERNAME }}' \
            -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            -e DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}' \
            -e BAIDU_API_KEY='${{ secrets.BAIDU_API_KEY }}' \
            -e BAIDU_SECRET_KEY='${{ secrets.BAIDU_SECRET_KEY }}' \
            $IMAGE_TAG

          echo "✅ Deployment Success! Pruning old images..."
          docker image prune -f