name: Docker Build and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 1. Maven 构建 (只打包，不传文件)
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 2. 登录阿里云仓库
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. 构建 Docker 镜像并推送到阿里云
    - name: Build and Push Image
      run: |
        # 使用当前 commit hash 作为版本号，同时也打一个 latest 标签
        docker build -t ${{ secrets.IMAGE_NAME }}:${{ github.sha }} .
        docker build -t ${{ secrets.IMAGE_NAME }}:latest .
        docker push ${{ secrets.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ secrets.IMAGE_NAME }}:latest

    # 4. 远程指挥火山服务器干活
    - name: Deploy to Volcano Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        script: |
          set +e
          
          echo "1. Logging into Registry..."
          docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }} ${{ secrets.DOCKER_REGISTRY }}
          
          echo "2. Pulling latest image..."
          docker pull ${{ secrets.IMAGE_NAME }}:latest
          
          echo "3. Removing old container..."
          docker stop ai-backend || true
          docker rm ai-backend || true
          
          echo "4. Starting new container with ENV VARS..."
          # === 关键修改点开始 ===
          # 注意：这里添加了 -e 参数来注入环境变量
          docker run -d \
            --name ai-backend \
            --net=host \
            --restart always \
            -e SPRING_DATASOURCE_URL='${{ secrets.DB_URL }}' \
            -e SPRING_DATASOURCE_USERNAME='${{ secrets.DB_USERNAME }}' \
            -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            -e DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}' \
            -e DEEPSEEK_API_URL='https://api.deepseek.com' \
            -e DEEPSEEK_API_MODEL='deepseek-chat' \
            -e FFMPEG_PATH='/usr/bin/ffmpeg' \
            -e SERVER_PORT='2580' \
            -e AUDIO_TEMP_DIR='/tmp' \
            -e FFPROBE_PATH='/usr/bin/ffprobe' \
            -e BAIDU_API_KEY='${{ secrets.BAIDU_API_KEY }}' \
            -e BAIDU_SECRET_KEY='${{ secrets.BAIDU_SECRET_KEY }}' \
            -e SCENE_PROMPTS_EXAM_PREP='Describe a historical building you visited.;Do you think AI will replace teachers?' \
            -e SCENE_PROMPTS_CAREER_GROWTH='Tell me about a time you handled a conflict.;How would you ask your boss for a deadline extension?' \
            -e STORAGE_TYPE='local' \
            -e STORAGE_LOCAL_ROOT='/app/uploads' \
            -e STORAGE_S3_ENDPOINT='http://localhost' \
            -e STORAGE_S3_ACCESS_KEY='dummy' \
            -e STORAGE_S3_SECRET_KEY='dummy' \
            -e STORAGE_S3_BUCKET='dummy' \
            ${{ secrets.IMAGE_NAME }}:latest
          # === 关键修改点结束 ===
            
          echo "5. Cleaning up..."
          docker image prune -f
          
          echo "✅ Deployment Complete!"