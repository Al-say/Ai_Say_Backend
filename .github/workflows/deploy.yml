name: CI/CD Deploy

on:
  push:
    branches: [ "master" ]

env:
  IMAGE_TAG: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest
  IMAGE_TAG_SHA: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}

jobs:
  # ── Job 1: 运行测试 ──────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn clean test -B

  # ── Job 2: 构建、推送镜像并部署 ──────────────────────
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 JDK 21（Maven 缓存加速）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. 编译打包（跳过测试，已在 Job 1 执行）
      - name: Build JAR
        run: mvn clean package -DskipTests -B

      # 4. 登录阿里云 ACR
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 构建并推送 Docker 镜像
      #    使用 Dockerfile.simple（基于 amazoncorretto:21 + ffmpeg）
      - name: Build and Push Docker Image
        run: |
          docker build -f Dockerfile.simple \
            -t ${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_TAG_SHA }} \
            .
          docker push ${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_TAG_SHA }}
          echo "✅ Image pushed: ${{ env.IMAGE_TAG }}"

      # 6. 将部署配置文件上传到服务器
      - name: Upload deploy configs
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf,ssl-init.sh,fix-iptables-docker.sh"
          target: "/opt/ai-backend"
          strip_components: 0

      # 7. SSH 部署到服务器（使用 docker-compose.prod.yml）
      - name: SSH Remote Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          envs: DOCKER_REGISTRY,IMAGE_NAME,DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,DEEPSEEK_API_KEY,BAIDU_API_KEY,BAIDU_SECRET_KEY,DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e
            DEPLOY_DIR="/opt/ai-backend"
            cd "$DEPLOY_DIR"

            echo "🚀 ===== Starting Deployment ====="

            # 1. 修复 iptables DROP 规则（防止 Docker 网络被阻断）
            if iptables -L DOCKER-USER -n 2>/dev/null | grep -q "^DROP"; then
              echo "⚠️  Removing stale DROP rule from DOCKER-USER chain..."
              iptables -D DOCKER-USER -j DROP 2>/dev/null || true
            fi

            # 2. 初始化 SSL 证书（首次部署执行，证书已存在则跳过）
            if [ ! -f /etc/ssl/certs/server.crt ]; then
              echo "🔐 SSL certificate not found, generating self-signed cert..."
              bash ssl-init.sh self-signed
            else
              echo "🔐 SSL certificate already exists, skipping..."
            fi

            # 3. 登录 ACR 并拉取最新镜像
            echo "📥 Pulling latest image..."
            docker login \
              --username=${{ secrets.DOCKER_USERNAME }} \
              --password=${{ secrets.DOCKER_PASSWORD }} \
              ${{ secrets.DOCKER_REGISTRY }}
            docker pull ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest

            # 4. 写入生产环境变量文件
            cat > .env << 'ENVEOF'
            DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }}
            IMAGE_NAME=${{ secrets.IMAGE_NAME }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            BAIDU_API_KEY=${{ secrets.BAIDU_API_KEY }}
            BAIDU_SECRET_KEY=${{ secrets.BAIDU_SECRET_KEY }}
            ENVEOF
            chmod 600 .env

            # 5. 滚动更新（docker-compose.prod.yml）
            echo "🔄 Rolling update with docker-compose..."
            docker-compose -f docker-compose.prod.yml --env-file .env pull a_say_backend
            docker-compose -f docker-compose.prod.yml --env-file .env up -d --no-deps a_say_backend nginx

            # 6. 等待服务启动（最长 90 秒，通过 nginx HTTPS 验证）
            echo "⏳ Waiting for HTTPS service to be healthy..."
            for i in $(seq 1 18); do
              sleep 5
              STATUS=$(curl -sfk "https://127.0.0.1/actuator/health" 2>/dev/null | grep -o '"status":"UP"' || echo "")
              if [ -n "$STATUS" ]; then
                echo "✅ HTTPS Service is UP after $((i*5))s"
                break
              fi
              echo "   Attempt $i/18: not ready yet..."
              if [ $i -eq 18 ]; then
                echo "❌ Health check failed! Container logs:"
                docker-compose -f docker-compose.prod.yml logs a_say_backend --tail=50
                exit 1
              fi
            done

            # 7. 清理旧镜像
            docker image prune -f
            echo "🎉 ===== Deployment Complete! HTTPS is live ====="
