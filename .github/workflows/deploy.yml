name: Docker Build and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 1. Maven 构建 (只打包，不传文件)
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 2. 登录阿里云仓库
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. 构建 Docker 镜像并推送到阿里云
    - name: Build and Push Image
      run: |
        # 使用当前 commit hash 作为版本号，同时也打一个 latest 标签
        docker build -t ${{ secrets.IMAGE_NAME }}:${{ github.sha }} .
        docker build -t ${{ secrets.IMAGE_NAME }}:latest .
        docker push ${{ secrets.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ secrets.IMAGE_NAME }}:latest

    # 4. 远程指挥火山服务器干活
    - name: Deploy to Volcano Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        script: |
          # 停止脚本若报错不退出 (|| true)
          set +e
          
          echo "1. Logging into Registry..."
          docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }} ${{ secrets.DOCKER_REGISTRY }}
          
          echo "2. Pulling latest image..."
          docker pull ${{ secrets.IMAGE_NAME }}:latest
          
          echo "3. Removing old container..."
          docker stop ai-backend || true
          docker rm ai-backend || true
          
          echo "4. Starting new container..."
          # --net=host 模式让容器直接使用宿主机的网络和端口，避免端口映射麻烦
          docker run -d \
            --name ai-backend \
            --net=host \
            --restart always \
            ${{ secrets.IMAGE_NAME }}:latest
            
          echo "5. Cleaning up..."
          docker image prune -f
          
          echo "✅ Deployment Complete!"