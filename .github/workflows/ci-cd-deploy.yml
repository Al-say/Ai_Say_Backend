name: CI/CD Deploy

on:
  push:
    branches: [ "master" ]

env:
  # 强制预演 Node.js 24 以应对 GitHub Actions 运行时升级警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_TAG: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest
  IMAGE_TAG_SHA: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}

jobs:
  # ── Job 1: 构建与测试 ──────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 一步完成测试和打包，避免重复编译
      - name: Build and Test
        run: mvn clean package -B

      # 将编译好的 JAR 包暂存，供下一个 Job 使用
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 1

  # ── Job 2: 构建、推送镜像并部署 ──────────────────────
  deploy:
    name: Build Image & Deploy
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 直接下载 Job 1 编译好的 JAR，跳过 Maven 编译步骤
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target/

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -f Dockerfile.simple \
            -t ${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_TAG_SHA }} \
            .
          docker push ${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_TAG_SHA }}
          echo "✅ Image pushed: ${{ env.IMAGE_TAG_SHA }}"

      - name: Upload deploy configs
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf,ssl-init.sh,fix-iptables-docker.sh"
          target: "/opt/ai-backend"
          strip_components: 0

      # 安全的 SSH 部署：使用 env 定义变量，彻底避免 ${{}} 注入风险
      - name: SSH Remote Deploy
        uses: appleboy/ssh-action@master
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG_SHA: ${{ env.IMAGE_TAG_SHA }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          # 显式声明需要传递给远程机器的环境变量
          envs: DOCKER_REGISTRY,IMAGE_NAME,DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,DEEPSEEK_API_KEY,BAIDU_API_KEY,BAIDU_SECRET_KEY,DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_TAG_SHA
          script: |
            set -e
            DEPLOY_DIR="/opt/ai-backend"
            cd "$DEPLOY_DIR"

            echo "🚀 ===== Starting Deployment ====="

            if iptables -L DOCKER-USER -n 2>/dev/null | grep -q "^DROP"; then
              echo "⚠️  Removing stale DROP rule from DOCKER-USER chain..."
              iptables -D DOCKER-USER -j DROP 2>/dev/null || true
            fi

            if [ ! -f /etc/ssl/certs/server.crt ]; then
              echo "🔐 SSL certificate not found, generating self-signed cert..."
              bash ssl-init.sh self-signed
            else
              echo "🔐 SSL certificate already exists, skipping..."
            fi

            echo "📥 Pulling specific image tag..."
            docker login --username="$DOCKER_USERNAME" --password="$DOCKER_PASSWORD" "$DOCKER_REGISTRY"
            # 采用 SHA tag 精确拉取，替代 latest
            docker pull "$IMAGE_TAG_SHA"

            # 写入 .env（注意这里移除了 ENVEOF 旁边的单引号，并使用 $VAR 格式读取上下文变量）
            cat > .env << ENVEOF
DOCKER_REGISTRY=$DOCKER_REGISTRY
IMAGE_NAME=$IMAGE_NAME
IMAGE_TAG=$IMAGE_TAG_SHA
DB_URL=$DB_URL
DB_USERNAME=$DB_USERNAME
DB_PASSWORD=$DB_PASSWORD
JWT_SECRET=$JWT_SECRET
DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
BAIDU_API_KEY=$BAIDU_API_KEY
BAIDU_SECRET_KEY=$BAIDU_SECRET_KEY
ENVEOF
            chmod 600 .env

            echo "🔄 Rolling update with docker-compose..."
            docker-compose -f docker-compose.prod.yml --env-file .env pull a_say_backend
            docker-compose -f docker-compose.prod.yml --env-file .env up -d --no-deps a_say_backend nginx

            echo "⏳ Waiting for HTTPS service to be healthy..."
            for i in $(seq 1 18); do
              sleep 5
              STATUS=$(curl -sfk "https://127.0.0.1/actuator/health" 2>/dev/null | grep -o '"status":"UP"' || echo "")
              if [ -n "$STATUS" ]; then
                echo "✅ HTTPS Service is UP after $((i*5))s"
                break
              fi
              echo "   Attempt $i/18: not ready yet..."
              if [ $i -eq 18 ]; then
                echo "❌ Health check failed! Container logs:"
                docker-compose -f docker-compose.prod.yml logs a_say_backend --tail=50
                exit 1
              fi
            done

            docker image prune -f
            echo "🎉 ===== Deployment Complete! HTTPS is live ====="
