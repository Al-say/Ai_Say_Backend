server:
  port: 2580
  address: 0.0.0.0

spring:
  application:
    name: speaking-assessment

  # H2 Database Configuration for local development and testing
  # datasource:
  #   url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  #   driverClassName: org.h2.Driver
  #   username: sa
  #   password: password

  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  # 🔥 生产环境请注释掉上面的H2配置，使用下面的PostgreSQL配置
  datasource:
    url: jdbc:postgresql://localhost:5432/speaking_db
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# DeepSeek AI API 配置 - 使用环境变量保护密钥
deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:dummy-key}  # 环境变量优先,本地开发可用 dummy
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
    model: ${DEEPSEEK_MODEL:deepseek-chat}

# JWT 认证配置 - 使用环境变量保护密钥
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyHereMustBeVeryLongAndComplex123!AtLeast32Characters}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 小时（毫秒）

# 百度 ASR 配置 - 使用环境变量保护密钥
baidu:
  app-id: ${BAIDU_APP_ID:dummy-id}
  api-key: ${BAIDU_API_KEY:dummy-key}
  secret-key: ${BAIDU_SECRET_KEY:dummy-secret}

# Audio Denoise
audio:
  denoise:
    enabled: true
  temp-dir: /tmp

ffmpeg:
  path: /usr/local/bin/ffmpeg

ffprobe:
  path: /usr/local/bin/ffprobe

# Scene Prompts
scene:
  prompts:
    exam-prep: "Describe a historical building you visited.;Do you think AI will replace teachers?"
    career-growth: "Tell me about a time you handled a conflict.;How would you ask your boss for a deadline extension?"

