server:
  port: 2580

spring:
  application:
    name: speaking-assessment

  # H2 Database Configuration for local development and testing
  # datasource:
  #   url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  #   driverClassName: org.h2.Driver
  #   username: sa
  #   password: password

  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  # 🔥 生产环境请注释掉上面的H2配置，使用下面的PostgreSQL配置
  datasource:
    url: jdbc:postgresql://postgres:5432/speaking_db
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# DeepSeek AI API 配置 - 使用环境变量保护密钥
deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:dummy-key}  # 环境变量优先,本地开发可用 dummy
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
    model: ${DEEPSEEK_MODEL:deepseek-chat}

# JWT 认证配置 - 使用环境变量保护密钥
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyHereMustBeVeryLongAndComplex123!AtLeast32Characters}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 小时（毫秒）

# 百度 ASR 配置 - 使用环境变量保护密钥
baidu:
  app-id: ${BAIDU_APP_ID:dummy-id}
  api-key: ${BAIDU_API_KEY:dummy-key}
  secret-key: ${BAIDU_SECRET_KEY:dummy-secret}

# Apple 登录配置 - 使用环境变量保护密钥
apple:
  signin:
    client-id: ${APPLE_CLIENT_ID:your.bundle.id}
    token-secret: ${APPLE_TOKEN_SECRET:dummy-secret}
    jwt:
      issuer: ${APPLE_JWT_ISSUER:com.zhupinzan.speaking}
      audience: ${APPLE_JWT_AUDIENCE:your.bundle.id}

# Audio Denoise
audio:
  denoise:
    enabled: true
  temp-dir: /tmp

ffmpeg:
  path: /usr/local/bin/ffmpeg

ffprobe:
  path: /usr/local/bin/ffprobe

# Scene Prompts
scene:
  prompts:
    exam-prep: "Describe a historical building you visited.;Do you think AI will replace teachers?"
    career-growth: "Tell me about a time you handled a conflict.;How would you ask your boss for a deadline extension?"

# S3/MinIO 存储配置 - 使用环境变量保护密钥
storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:speaking-audio}
    region: ${S3_REGION:us-east-1}
