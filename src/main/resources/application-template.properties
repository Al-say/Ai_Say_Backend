# 服务器配置
server.port=8082

# H2 Database Configuration for local development and testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DeepSeek AI API 配置
# DeepSeek 配置
deepseek.api.key=your_deepseek_api_key
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.model=deepseek-chat

# 百度 ASR 配置示例（不要把真实密钥提交到 Git）
# 请在本地创建 `application.properties` 或通过环境变量设置以下值：
# BAIDU_APP_ID, BAIDU_API_KEY, BAIDU_SECRET_KEY
baidu.app-id=your_baidu_app_id
baidu.api-key=your_baidu_api_key
baidu.secret-key=your_baidu_secret_key

# Apple 登录配置
apple.signin.client-id=your.bundle.id
apple.signin.token-secret=${APPLE_TOKEN_SECRET:}
apple.signin.jwt.issuer=com.zhupinzan.speaking
apple.signin.jwt.audience=your.bundle.id

# S3/MinIO Configuration for local development
storage.s3.endpoint=http://localhost:9000
storage.s3.region=us-east-1
storage.s3.access-key=minioadmin
storage.s3.secret-key=minioadmin

# Audio Denoise
audio.denoise.enabled=true
ffmpeg.path=/usr/local/bin/ffmpeg



