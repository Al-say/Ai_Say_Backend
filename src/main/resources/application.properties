# 服务器配置
server.port=2580

# 测试更改

# H2 Database Configuration for local development and testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate 配置 - 自动建表和调试
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# DeepSeek AI API 配置
# DeepSeek 配置
deepseek.api.key=dummy-key
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.model=deepseek-chat

# 百度 ASR 配置示例（不要把真实密钥提交到 Git）
# 请在本地创建 `application.properties` 或通过环境变量设置以下值：
# BAIDU_APP_ID, BAIDU_API_KEY, BAIDU_SECRET_KEY
baidu.app-id=dummy-id
baidu.api-key=dummy-key
baidu.secret-key=dummy-secret

# Apple 登录配置
apple.signin.client-id=your.bundle.id
apple.signin.token-secret=dummy-secret
apple.signin.jwt.issuer=com.zhupinzan.speaking
apple.signin.jwt.audience=your.bundle.id

# Audio Denoise
audio.denoise.enabled=true
ffmpeg.path=/usr/local/bin/ffmpeg
ffprobe.path=/usr/local/bin/ffprobe
audio.temp-dir=/tmp

# Scene Prompts
scene.prompts.exam-prep=Describe a historical building you visited.;Do you think AI will replace teachers?
scene.prompts.career-growth=Tell me about a time you handled a conflict.;How would you ask your boss for a deadline extension?

# S3/MinIO 存储配置
storage.s3.endpoint=http://localhost:9000
storage.s3.access-key=minioadmin
storage.s3.secret-key=minioadmin
storage.s3.bucket=speaking-audio
storage.s3.region=us-east-1# JPA/Hibernate 配置 - 自动建表和调试
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
